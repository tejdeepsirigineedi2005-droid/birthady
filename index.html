<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }

  body {
    height:100vh;
    width:100vw;
    overflow:hidden;
    background:#1a0b2e;
    position:relative;
  }

  /* ---------- SLIDESHOW BACKGROUND ---------- */
  .slideshow {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
  }
  .slideshow img {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    filter:brightness(0.45) blur(1px);
    transition:opacity 2s ease-in-out;
  }
  .slideshow img.active { opacity:1; }

  .overlay-dark {
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background:rgba(20,0,40,0.35);
    z-index:1;
  }

  .screen {
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .hidden { display:none !important; }

  #nameScreen h1 {
    color:#ffd6f2;
    font-size:2.2rem;
    margin-bottom:25px;
    text-shadow:0 0 15px #ff6fd8;
  }
  #nameInput {
    padding:14px 20px;
    font-size:1.1rem;
    border-radius:30px;
    border:none;
    outline:none;
    width:280px;
    text-align:center;
    margin-bottom:20px;
  }
  #submitBtn {
    padding:14px 34px;
    font-size:1.1rem;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff6fd8,#a685ff);
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px rgba(255,111,216,0.6);
    transition:transform 0.2s;
  }
  #submitBtn:hover { transform:scale(1.08); }

  #wishText {
    font-size:2.6rem;
    color:#fff;
    text-shadow:0 0 20px #ff6fd8, 0 0 40px #a685ff;
    animation: pop 1s ease;
    margin-bottom:10px;
  }
  #subText {
    color:#ffe1f7;
    font-size:1.2rem;
    margin-bottom:30px;
    opacity:0.9;
  }
  @keyframes pop {
    0% { transform:scale(0); opacity:0; }
    60% { transform:scale(1.2); opacity:1; }
    100% { transform:scale(1); }
  }

  .cake-wrap {
    cursor:pointer;
    position:relative;
    user-select:none;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform:translateY(0px); }
    50% { transform:translateY(-8px); }
  }
  .flame {
    width:8px; height:16px;
    background:radial-gradient(circle, #fff59d, #ff9800);
    border-radius:50% 50% 50% 50%;
    margin:0 auto;
    box-shadow:0 0 15px 4px #ffb300;
    animation: flicker 0.4s infinite alternate;
    transition: opacity 0.4s;
  }
  @keyframes flicker {
    from { transform:scaleY(1) rotate(-2deg); }
    to { transform:scaleY(1.15) rotate(2deg); }
  }
  .candle {
    width:6px; height:26px;
    background:#ff6fd8;
    margin:0 auto;
  }
  .cake-top {
    width:160px; height:40px;
    background:#fff0f5;
    border-radius:10px 10px 0 0;
    margin:0 auto;
    position:relative;
    box-shadow: inset 0 -4px 0 #ffb6de;
    transition: transform 0.6s ease;
  }
  .cake-mid {
    width:190px; height:50px;
    background:#ffd6ea;
    margin:0 auto;
    box-shadow: inset 0 -6px 0 #ff9ecf;
    transition: transform 0.6s ease;
  }
  .cake-base {
    width:220px; height:55px;
    background:#ff9ecf;
    border-radius:0 0 14px 14px;
    margin:0 auto;
    box-shadow: inset 0 -8px 0 #ff6fb0;
  }
  .cut .cake-top {
    transform: translateX(-70px) rotate(-15deg);
  }
  .cut .cake-mid {
    transform: translateY(4px);
  }
  .cut .flame { opacity:0; }

  #cakeHint {
    color:#ffe1f7;
    margin-top:20px;
    font-size:0.95rem;
    opacity:0.8;
  }

  .confetti {
    position:fixed;
    top:-20px;
    z-index:3;
    width:10px; height:16px;
    opacity:0.9;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(110vh) rotate(360deg); opacity:0.3; }
  }
</style>
</head>
<body>

  <div class="slideshow" id="slideshow"></div>
  <div class="overlay-dark"></div>

  <div class="screen" id="nameScreen">
    <h1>🎉 Enter Your Name 🎉</h1>
    <input type="text" id="nameInput" placeholder="Type your name here...">
    <br>
    <button id="submitBtn">Submit</button>
  </div>

  <div class="screen hidden" id="wishScreen">
    <div id="wishText"></div>
    <div id="subText">Click the cake to cut it! 🔪🎂</div>

    <div class="cake-wrap" id="cake">
      <div class="flame"></div>
      <div class="candle"></div>
      <div class="cake-top"></div>
      <div class="cake-mid"></div>
      <div class="cake-base"></div>
    </div>
    <div id="cakeHint">👆 Tap the cake</div>
  </div>

  <!-- song.mp3 same folder lo undi -->
  <audio id="bgSong" src="song.mp3" loop></audio>

  <script>
    const photoList = [
      "photo1.jpg",
      "photo2.jpg",
      "photo3.jpg"
    ];

    const slideshowDiv = document.getElementById('slideshow');
    let slideIndex = 0;

    photoList.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if (i === 0) img.classList.add('active');
      slideshowDiv.appendChild(img);
    });

    function rotateSlides() {
      const imgs = slideshowDiv.querySelectorAll('img');
      if (imgs.length === 0) return;
      imgs[slideIndex].classList.remove('active');
      slideIndex = (slideIndex + 1) % imgs.length;
      imgs[slideIndex].classList.add('active');
    }
    setInterval(rotateSlides, 3500);

    const nameScreen = document.getElementById('nameScreen');
    const wishScreen = document.getElementById('wishScreen');
    const nameInput = document.getElementById('nameInput');
    const submitBtn = document.getElementById('submitBtn');
    const wishText = document.getElementById('wishText');
    const bgSong = document.getElementById('bgSong');

    function startWish() {
      const name = nameInput.value.trim() || "Friend";
      wishText.textContent = "🎂 Happy Birthday, " + name + "! 🎉";
      nameScreen.classList.add('hidden');
      wishScreen.classList.remove('hidden');
      bgSong.currentTime = 0;
      bgSong.play().catch(()=>{});
      launchConfetti(60);
    }

    submitBtn.addEventListener('click', startWish);
    nameInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') startWish(); });

    const cake = document.getElementById('cake');
    const cakeHint = document.getElementById('cakeHint');
    let cutDone = false;

    cake.addEventListener('click', () => {
      if (cutDone) return;
      cutDone = true;
      cake.classList.add('cut');
      cakeHint.textContent = "🎉 Cake Cut! Enjoy the celebration 🎉";
      launchConfetti(120);
    });

    function launchConfetti(amount) {
      const colors = ['#ff6fd8','#a685ff','#ffd166','#06d6a0','#ef476f'];
      for (let i = 0; i < amount; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (2 + Math.random()*2) + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4500);
      }
    }
  </script>
</body>
</html>
